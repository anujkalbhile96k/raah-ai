[project]
name = "raah-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
